<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交互式功能测试仪表盘</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 30px; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card {
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
        .card h3 { margin-bottom: 15px; font-size: 16px; color: #00d2ff; }
        .chart-box { width: 100%; height: 300px; }
        .counter-display {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            color: #00d2ff;
            margin: 20px 0;
        }
        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            color: #fff;
        }
        .btn:hover { transform: scale(1.05); opacity: 0.9; }
        .btn-blue { background: linear-gradient(135deg, #00d2ff, #3a7bd5); }
        .btn-green { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .btn-red { background: linear-gradient(135deg, #f953c6, #b91d73); }
        .btn-orange { background: linear-gradient(135deg, #f7971e, #ffd200); }
        .slider-container { margin: 15px 0; }
        .slider-container label { display: block; margin-bottom: 8px; color: #ccc; font-size: 14px; }
        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00d2ff;
            cursor: pointer;
        }
        .slider-value { text-align: center; color: #00d2ff; font-size: 20px; font-weight: bold; margin-top: 8px; }
        .status-bar {
            background: rgba(0,210,255,0.1);
            border: 1px solid rgba(0,210,255,0.3);
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            font-size: 13px;
            color: #00d2ff;
            min-height: 40px;
        }
        .progress-track {
            width: 100%;
            height: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border-radius: 10px;
            transition: width 0.3s;
        }
        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin: 3px;
            background: rgba(0,210,255,0.2);
            border: 1px solid rgba(0,210,255,0.4);
        }
        .footer { text-align: center; margin-top: 30px; color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 交互式功能测试仪表盘</h1>
        <p class="subtitle">测试计数器、动态图表、滑块交互、进度条等核心功能</p>

        <div class="grid">
            <!-- 计数器卡片 -->
            <div class="card">
                <h3>🔢 交互计数器</h3>
                <div class="counter-display" id="counter" style="width: 100%; height: 400px;">0</div>
                <div class="btn-group">
                    <button class="btn btn-blue" onclick="increment()">+1</button>
                    <button class="btn btn-red" onclick="decrement()">-1</button>
                    <button class="btn btn-orange" onclick="reset()">重置</button>
                </div>
                <div class="status-bar" id="counterStatus" style="width: 100%; height: 400px;">点击按钮开始计数</div>
            </div>

            <!-- 动态图表卡片 -->
            <div class="card">
                <h3>📊 动态数据图表</h3>
                <div id="chart" class="chart-box" style="width: 100%; height: 400px;"></div>
                <div class="btn-group" style="margin-top: 10px;">
                    <button class="btn btn-green" onclick="addData()">添加数据</button>
                    <button class="btn btn-red" onclick="clearData()">清空</button>
                </div>
            </div>

            <!-- 滑块控制卡片 -->
            <div class="card">
                <h3>🎚️ 滑块控制</h3>
                <div class="slider-container">
                    <label>调整数值（0-100）</label>
                    <input type="range" id="slider" min="0" max="100" value="50" oninput="updateSlider()">
                    <div class="slider-value" id="sliderValue" style="width: 100%; height: 400px;">50</div>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width: 100%; height: 400px;"></div>
                </div>
                <div class="status-bar" id="sliderStatus" style="width: 100%; height: 400px;">拖动滑块查看进度变化</div>
            </div>

            <!-- 标签交互卡片 -->
            <div class="card">
                <h3>🏷️ 标签选择器</h3>
                <div id="tags" style="width: 100%; height: 400px;">
                    <span class="tag" onclick="selectTag(this)">前端开发</span>
                    <span class="tag" onclick="selectTag(this)">数据分析</span>
                    <span class="tag" onclick="selectTag(this)">人工智能</span>
                    <span class="tag" onclick="selectTag(this)">云计算</span>
                    <span class="tag" onclick="selectTag(this)">区块链</span>
                </div>
                <div class="status-bar" id="tagStatus" style="width: 100%; height: 400px;">点击标签进行选择</div>
            </div>
        </div>

        <div class="footer">交互式 HTML 应用功能测试 | 大明白智能助手</div>
    </div>

    <script>
        // 计数器逻辑
        let count = 0;
        function increment() {
            count++;
            document.getElementById('counter').textContent = count;
            document.getElementById('counterStatus').textContent = '✅ 已增加，当前值：' + count;
        }
        function decrement() {
            count--;
            document.getElementById('counter').textContent = count;
            document.getElementById('counterStatus').textContent = '⬇️ 已减少，当前值：' + count;
        }
        function reset() {
            count = 0;
            document.getElementById('counter').textContent = count;
            document.getElementById('counterStatus').textContent = '🔄 已重置为 0';
        }

        // 图表逻辑
        let chartData = [10, 20, 15, 30, 25, 40];
        let chart;
        window.onload = function() {
            chart = echarts.init(document.getElementById('chart'));
            updateChart();
        };
        function updateChart() {
            chart.setOption({
                tooltip: { trigger: 'axis' },
                grid: { top: 20, left: 40, right: 20, bottom: 30 },
                xAxis: {
                    type: 'category',
                    data: chartData.map((_, i) => '数据' + (i + 1)),
                    axisLabel: { color: '#aaa' }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: { color: '#aaa' }
                },
                series: [{
                    name: '数值',
                    type: 'bar',
                    data: chartData,
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#00d2ff' },
                            { offset: 1, color: '#3a7bd5' }
                        ])
                    },
                    barWidth: '50%'
                }]
            });
        }
        function addData() {
            chartData.push(Math.floor(Math.random() * 50) + 5);
            updateChart();
        }
        function clearData() {
            chartData = [];
            updateChart();
        }

        // 滑块逻辑
        function updateSlider() {
            const val = document.getElementById('slider').value;
            document.getElementById('sliderValue').textContent = val;
            document.getElementById('progressFill').style.width = val + '%';
            document.getElementById('sliderStatus').textContent = '📈 当前进度：' + val + '%';
        }

        // 标签选择逻辑
        function selectTag(el) {
            const tags = document.querySelectorAll('.tag');
            tags.forEach(t => {
                t.style.background = 'rgba(0,210,255,0.2)';
                t.style.border = '1px solid rgba(0,210,255,0.4)';
            });
            el.style.background = 'rgba(0,210,255,0.5)';
            el.style.border = '1px solid #00d2ff';
            document.getElementById('tagStatus').textContent = '🏷️ 已选择：' + el.textContent;
        }
    </script>
</body>
</html>
