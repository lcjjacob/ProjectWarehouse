<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>大明白功能测试页</title>
<style>
body{font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:20px}
.card{background:#fff;border-radius:16px;padding:40px;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{color:#667eea;text-align:center;margin-bottom:10px}
p{color:#666;text-align:center;margin-bottom:30px}
.btn{display:block;width:100%;padding:14px;margin:10px 0;border:none;border-radius:8px;font-size:16px;cursor:pointer;color:#fff;transition:transform .2s}
.btn:hover{transform:scale(1.03)}
.btn1{background:#667eea}.btn2{background:#f093fb}.btn3{background:#4facfe}
#result{margin-top:20px;padding:15px;background:#f8f9fa;border-radius:8px;text-align:center;color:#333;min-height:40px}
</style>
</head>
<body>
<div class="card">
<h1>🚀 大明白功能测试</h1>
<p>点击下方按钮测试交互功能</p>
<button class="btn btn1" onclick="showMsg('✅ 按钮1点击成功！交互功能正常')">测试按钮 1</button>
<button class="btn btn2" onclick="showMsg('🎉 按钮2点击成功！事件绑定正常')">测试按钮 2</button>
<button class="btn btn3" onclick="showMsg('⏰ 当前时间：'+new Date().toLocaleString())">显示当前时间</button>
<div id="result" style="width: 100%; height: 400px;">等待操作...</div>
</div>
<script>
function showMsg(msg){document.getElementById('result').innerHTML=msg}
</script>
</body>
</html>
