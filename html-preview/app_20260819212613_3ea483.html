<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大明白补充功能测试仪表盘</title>
<script>
(function() {
    var script = document.createElement('script');
    script.src = 'https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js';
    script.onload = function() {
        // ECharts 加载成功后，强制触发 window.onload，确保大模型写的初始化代码被执行
        if (typeof window.onload === 'function') {
            window.onload();
        }
    };
    script.onerror = function() {
        // 主 CDN 挂了，自动切换备用 CDN
        var backup = document.createElement('script');
        backup.src = 'https://lib.baomitu.com/echarts/5.4.3/echarts.min.js';
        backup.onload = function() {
            if (typeof window.onload === 'function') {
                window.onload();
            }
        };
        document.head.appendChild(backup);
    };
    document.head.appendChild(script);
})();
</script>
<style>
  body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
  .header { text-align: center; padding: 20px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-radius: 12px; margin-bottom: 20px; }
  .header h1 { margin: 0; font-size: 24px; }
  .header p { margin: 8px 0 0; opacity: 0.9; }
  .stats { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card { flex: 1; min-width: 150px; background: white; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .stat-card .num { font-size: 32px; font-weight: bold; color: #667eea; }
  .stat-card .label { color: #666; margin-top: 8px; font-size: 14px; }
  .chart-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
  .chart-container h3 { margin-top: 0; color: #333; }
  #main { width: 100%; height: 400px; }
  .result-list { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .result-list h3 { margin-top: 0; color: #333; }
  .result-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
  .result-item:last-child { border-bottom: none; }
  .status-ok { color: #52c41a; font-weight: bold; }
  .status-warn { color: #faad14; font-weight: bold; }
</style>
</head>
<body>
<div class="header">
  <h1>🎯 大明白补充功能测试仪表盘</h1>
  <p>测试时间：2026年8月19日 21:24</p>
</div>

<div class="stats">
  <div class="stat-card"><div class="num">14</div><div class="label">测试功能总数</div></div>
  <div class="stat-card"><div class="num">13</div><div class="label">✅ 正常通过</div></div>
  <div class="stat-card"><div class="num">1</div><div class="label">⚠️ 权限受限</div></div>
  <div class="stat-card"><div class="num">92.9%</div><div class="label">通过率</div></div>
</div>

<div class="chart-container">
  <h3>📊 功能测试状态分布</h3>
  <div id="main" style="width: 100%; height: 400px;"></div>
</div>

<div class="result-list">
  <h3>📋 详细测试结果</h3>
  <div class="result-item"><span>📦 快递物流查询</span><span class="status-ok">✅ 正常</span></div>
  <div class="result-item"><span>📄 PDF在线解析</span><span class="status-ok">✅ 正常</span></div>
  <div class="result-item"><span>🔍 OCR图片识别</span><span class="status-ok">✅ 正常</span></div>
  <div class="result-item"><span>🗺️ 地图路线规划</span><span class="status-warn">⚠️ 权限受限</span></div>
  <div class="result-item"><span>🌐 网页抓取</span><span class="status-ok">✅ 正常</span></div>
  <div class="result-item"><span>📧 邮件发送</span><span class="status-ok">✅ 正常</span></div>
  <div class="result-item"><span>🐍 Python代码执行</span><span class="status-ok">✅ 正常</span></div>
  <div class="result-item"><span>🐙 GitHub仓库洞察</span><span class="status-ok">✅ 正常</span></div>
  <div class="result-item"><span>📚 学术文献检索</span><span class="status-ok">✅ 正常</span></div>
  <div class="result-item"><span>🏢 企查查企业查询</span><span class="status-ok">✅ 正常</span></div>
  <div class="result-item"><span>⏰ 定时任务查询</span><span class="status-ok">✅ 正常</span></div>
  <div class="result-item"><span>🎨 图片生成</span><span class="status-ok">✅ 正常</span></div>
  <div class="result-item"><span>🧠 思维导图</span><span class="status-ok">✅ 正常</span></div>
  <div class="result-item"><span>📝 飞书文档</span><span class="status-ok">✅ 正常</span></div>
</div>

<script>
window.onload = function() {
  var chart = echarts.init(document.getElementById('main'));
  var option = {
    tooltip: { trigger: 'item' },
    legend: { bottom: 0 },
    series: [{
      name: '测试状态',
      type: 'pie',
      radius: ['40%', '70%'],
      avoidLabelOverlap: false,
      itemStyle: { borderRadius: 10, borderColor: '#fff', borderWidth: 2 },
      label: { show: true, formatter: '{b}: {c}' },
      data: [
        { value: 13, name: '✅ 正常', itemStyle: { color: '#52c41a' } },
        { value: 1, name: '⚠️ 受限', itemStyle: { color: '#faad14' } }
      ]
    }]
  };
  chart.setOption(option);
};
</script>
</body>
</html>
